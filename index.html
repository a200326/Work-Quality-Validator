<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WorkQualityValidator — GenLayer Studio</title>
<style>
  body { font-family: -apple-system, Tahoma, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; background: #0f1115; color: #e6e6e6; }
  h1 { font-size: 20px; }
  h2 { font-size: 16px; margin-top: 36px; border-bottom: 1px solid #333; padding-bottom: 6px; }
  label { display: block; margin-top: 10px; font-size: 13px; color: #aaa; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; background: #1a1d24; color: #eee; border: 1px solid #333; border-radius: 6px; font-family: monospace; }
  button { margin-top: 14px; padding: 10px 16px; background: #4f7cff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button:hover { background: #3d68e6; }
  pre { background: #1a1d24; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
  .card { background: #171a21; padding: 16px; border-radius: 10px; margin-top: 12px; }
  .addr { font-size: 12px; color: #888; }
</style>
</head>
<body>

<h1>WorkQualityValidator</h1>
<p class="addr">Contract: <code id="contractAddr">0x1eB3E0bc95c6b60816203401877f15b96aEeFDb1</code> (GenLayer Studio)</p>

<div class="card">
  <label>Private key (test key only — kept in memory, never saved or sent anywhere else)</label>
  <input id="privKey" type="password" placeholder="0x..." />
</div>

<h2>1. Create Contract (Client)</h2>
<div class="card">
  <label>Freelancer address</label>
  <input id="c_freelancer" placeholder="0x..." />
  <label>Rubric (one criterion per line)</label>
  <textarea id="c_rubric" rows="3">Code compiles
Has unit tests
Matches the spec</textarea>
  <label>Threshold (0-100)</label>
  <input id="c_threshold" value="80" />
  <label>Deadline (unix timestamp)</label>
  <input id="c_deadline" value="1767225600" />
  <label>Escrow amount (GEN)</label>
  <input id="c_value" value="1" />
  <button onclick="createContract()">Create</button>
  <pre id="c_out"></pre>
</div>

<h2>2. Submit Work (Freelancer)</h2>
<div class="card">
  <label>Contract ID</label>
  <input id="s_id" value="0" />
  <label>Delivery URL</label>
  <input id="s_url" placeholder="https://raw.githubusercontent.com/..." />
  <button onclick="submitWork()">Submit</button>
  <pre id="s_out"></pre>
</div>

<h2>3. View Contract</h2>
<div class="card">
  <label>Contract ID</label>
  <input id="g_id" value="0" />
  <button onclick="getContract()">Get</button>
  <pre id="g_out"></pre>
</div>

<h2>4. Balance / Withdraw</h2>
<div class="card">
  <label>Address to check</label>
  <input id="b_addr" placeholder="0x..." />
  <button onclick="getBalance()">Check balance</button>
  <button onclick="withdraw()">Withdraw (as connected account)</button>
  <pre id="b_out"></pre>
</div>

<script type="module">
  import { createClient, createAccount } from "https://esm.sh/genlayer-js@latest";
  import { studionet } from "https://esm.sh/genlayer-js@latest/chains";
  import { TransactionStatus } from "https://esm.sh/genlayer-js@latest/types";

  const CONTRACT = document.getElementById("contractAddr").textContent.trim();

  function getClient() {
    const pk = document.getElementById("privKey").value.trim();
    if (!pk) throw new Error("Enter a private key first (test key only).");
    const account = createAccount(pk);
    return createClient({ chain: studionet, account });
  }

  async function write(fn, args, value = 0) {
    const client = getClient();
    const hash = await client.writeContract({
      address: CONTRACT,
      functionName: fn,
      args,
      value: value ? BigInt(Math.floor(value * 1e18)) : 0n,
    });
    const receipt = await client.waitForTransactionReceipt({
      hash,
      status: TransactionStatus.FINALIZED,
      retries: 60,
      interval: 3000,
    });
    return { hash, receipt };
  }

  async function read(fn, args) {
    const client = createClient({ chain: studionet });
    return client.readContract({ address: CONTRACT, functionName: fn, args });
  }

  window.createContract = async () => {
    const out = document.getElementById("c_out");
    out.textContent = "Sending...";
    try {
      const rubric = document.getElementById("c_rubric").value
        .split("\n").map(s => s.trim()).filter(Boolean);
      const { hash, receipt } = await write("create_contract", [
        document.getElementById("c_freelancer").value.trim(),
        rubric,
        parseInt(document.getElementById("c_threshold").value),
        parseInt(document.getElementById("c_deadline").value),
      ], parseFloat(document.getElementById("c_value").value));
      out.textContent = "Finalized: " + hash + "\n" + JSON.stringify(receipt, null, 2);
    } catch (e) { out.textContent = "Error: " + e.message; }
  };

  window.submitWork = async () => {
    const out = document.getElementById("s_out");
    out.textContent = "Sending...";
    try {
      const { hash, receipt } = await write("submit_work", [
        parseInt(document.getElementById("s_id").value),
        document.getElementById("s_url").value.trim(),
      ]);
      out.textContent = "Finalized: " + hash + "\n" + JSON.stringify(receipt, null, 2);
    } catch (e) { out.textContent = "Error: " + e.message; }
  };

  window.getContract = async () => {
    const out = document.getElementById("g_out");
    out.textContent = "Loading...";
    try {
      const result = await read("get_contract", [parseInt(document.getElementById("g_id").value)]);
      out.textContent = JSON.stringify(JSON.parse(result), null, 2);
    } catch (e) { out.textContent = "Error: " + e.message; }
  };

  window.getBalance = async () => {
    const out = document.getElementById("b_out");
    out.textContent = "Loading...";
    try {
      const result = await read("get_balance", [document.getElementById("b_addr").value.trim()]);
      out.textContent = "Balance (ledger): " + result;
    } catch (e) { out.textContent = "Error: " + e.message; }
  };

  window.withdraw = async () => {
    const out = document.getElementById("b_out");
    out.textContent = "Sending...";
    try {
      const { hash, receipt } = await write("withdraw", []);
      out.textContent = "Finalized: " + hash + "\n" + JSON.stringify(receipt, null, 2);
    } catch (e) { out.textContent = "Error: " + e.message; }
  };
</script>

</body>
</html>
